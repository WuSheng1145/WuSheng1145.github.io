<script>
document.addEventListener('DOMContentLoaded', function() {
  var btn = document.querySelector('.back-to-top');
  if (btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
});
</script>
