<!-- start custom footer snippets -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  var btn = document.querySelector('.back-to-top');
  if (btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
});
</script>

<!-- 桌宠：一只会动的猫 -->
<style>
#desk-pet {
  position: fixed;
  bottom: 12px;
  left: 60px;
  z-index: 9999;
  cursor: pointer;
  user-select: none;
  transition: transform 0.3s ease;
}

#desk-pet svg {
  width: 64px;
  height: 64px;
  display: block;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
}

/* 走路摇晃动画 */
#desk-pet.walking svg {
  animation: cat-walk 0.4s infinite alternate;
}

@keyframes cat-walk {
  0% { transform: rotate(-3deg) translateY(0); }
  100% { transform: rotate(3deg) translateY(-3px); }
}

/* 转身 */
#desk-pet.flip svg {
  transform: scaleX(-1);
}

/* 气泡 */
.cat-bubble {
  position: absolute;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%) scale(0);
  background: #fff;
  color: #333;
  padding: 8px 14px;
  border-radius: 14px;
  font-size: 13px;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  pointer-events: none;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}

.cat-bubble::after {
  content: '';
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 6px 6px 0;
  border-style: solid;
  border-color: #fff transparent transparent transparent;
}

.cat-bubble.show {
  transform: translateX(-50%) scale(1);
  opacity: 1;
}

/* 睡觉 Zzz */
.cat-zzz {
  position: absolute;
  top: -10px;
  right: -5px;
  font-size: 18px;
  font-weight: bold;
  color: #60a5fa;
  opacity: 0;
}

.cat-zzz.show {
  animation: zzz-float 2s infinite;
}

@keyframes zzz-float {
  0% { opacity: 0; transform: translateY(0) translateX(0); }
  50% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-20px) translateX(10px); }
}
</style>

<div id="desk-pet">
  <div class="cat-bubble" id="cat-bubble">喵喵~</div>
  <div class="cat-zzz" id="cat-zzz">Zzz</div>
  <!-- 像素风小猫 SVG -->
  <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <!-- 身体 -->
    <rect x="16" y="28" width="32" height="24" rx="6" fill="#fb923c"/>
    <!-- 头 -->
    <rect x="20" y="12" width="24" height="20" rx="8" fill="#fb923c"/>
    <!-- 耳朵 -->
    <polygon points="20,16 14,4 28,12" fill="#fb923c"/>
    <polygon points="44,16 50,4 36,12" fill="#fb923c"/>
    <polygon points="18,14 15,6 25,12" fill="#f97316"/>
    <polygon points="46,14 49,6 39,12" fill="#f97316"/>
    <!-- 眼睛 -->
    <circle cx="27" cy="22" r="2.5" fill="#1f2937"/>
    <circle cx="37" cy="22" r="2.5" fill="#1f2937"/>
    <!-- 瞳孔高光 -->
    <circle cx="28" cy="21" r="0.8" fill="#fff"/>
    <circle cx="38" cy="21" r="0.8" fill="#fff"/>
    <!-- 鼻子 -->
    <rect x="30" y="26" width="4" height="3" rx="1.5" fill="#f472b6"/>
    <!-- 嘴巴 -->
    <path d="M28 29 Q32 32 36 29" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- 肚子 -->
    <rect x="24" y="36" width="16" height="14" rx="7" fill="#ffedd5"/>
    <!-- 脚 -->
    <rect x="18" y="48" width="8" height="6" rx="3" fill="#fb923c"/>
    <rect x="38" y="48" width="8" height="6" rx="3" fill="#fb923c"/>
    <!-- 尾巴 -->
    <path d="M46 36 Q56 28 54 18" stroke="#fb923c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 胡须 -->
    <line x1="16" y1="24" x2="10" y2="22" stroke="#1f2937" stroke-width="0.8" opacity="0.3"/>
    <line x1="16" y1="27" x2="10" y2="28" stroke="#1f2937" stroke-width="0.8" opacity="0.3"/>
    <line x1="48" y1="24" x2="54" y2="22" stroke="#1f2937" stroke-width="0.8" opacity="0.3"/>
    <line x1="48" y1="27" x2="54" y2="28" stroke="#1f2937" stroke-width="0.8" opacity="0.3"/>
  </svg>
</div>

<script>
(function() {
  const pet = document.getElementById('desk-pet');
  const bubble = document.getElementById('cat-bubble');
  const zzz = document.getElementById('cat-zzz');
  
  const quotes = [
    "喵喵~",
    "今天刷了几道题？",
    "AC 了吗？",
    "WA 了？摸摸头",
    "记得写题解哦",
    "在写博客吗？",
    "加油，OIer！",
    "咕咕咕...",
    "去睡觉吧，别卷了",
    "这题好难喵",
    "Ctrl+C Ctrl+V",
    "我要吃鱼干"
  ];
  
  let x = 60;
  let direction = 1; // 1 = right, -1 = left
  let state = 'idle'; // idle, walk, sleep
  let targetX = x;
  
  function setState(s) {
    state = s;
    pet.classList.remove('walking', 'flip');
    zzz.classList.remove('show');
    
    if (s === 'walk') {
      pet.classList.add('walking');
      if (direction === -1) pet.classList.add('flip');
    } else if (s === 'sleep') {
      zzz.classList.add('show');
    } else if (s === 'idle') {
      if (direction === -1) pet.classList.add('flip');
    }
  }
  
  function move() {
    if (state !== 'walk') return;
    
    const speed = 0.6;
    const maxX = window.innerWidth - 80;
    const minX = 20;
    
    x += speed * direction;
    
    if (x >= maxX) {
      direction = -1;
      setState('walk');
    } else if (x <= minX) {
      direction = 1;
      setState('walk');
    }
    
    pet.style.left = x + 'px';
  }
  
  function pickNewTarget() {
    const maxX = window.innerWidth - 80;
    targetX = Math.random() * (maxX - 40) + 40;
    direction = targetX > x ? 1 : -1;
    setState('walk');
  }
  
  function showBubble(text) {
    bubble.textContent = text || quotes[Math.floor(Math.random() * quotes.length)];
    bubble.classList.add('show');
    setTimeout(() => bubble.classList.remove('show'), 2500);
  }
  
  // 状态机循环
  function stateLoop() {
    const r = Math.random();
    
    if (state === 'walk') {
      if (r < 0.02) {
        setState('idle');
        setTimeout(stateLoop, 2000 + Math.random() * 3000);
        return;
      }
      if (Math.abs(x - targetX) < 5) {
        setState('idle');
        setTimeout(stateLoop, 1500 + Math.random() * 2000);
        return;
      }
    } else if (state === 'idle') {
      if (r < 0.3) {
        setState('sleep');
        setTimeout(stateLoop, 4000 + Math.random() * 4000);
        return;
      } else {
        pickNewTarget();
        return;
      }
    } else if (state === 'sleep') {
      setState('idle');
      setTimeout(stateLoop, 1000);
      return;
    }
    
    setTimeout(stateLoop, 500);
  }
  
  // 点击互动
  pet.addEventListener('click', function() {
    if (state === 'sleep') {
      setState('idle');
      showBubble("被你吵醒了！");
    } else {
      showBubble();
    }
  });
  
  // 鼠标靠近时看向鼠标
  document.addEventListener('mousemove', function(e) {
    if (state === 'sleep') return;
    const rect = pet.getBoundingClientRect();
    const petCenter = rect.left + rect.width / 2;
    if (Math.abs(e.clientX - petCenter) < 100 && Math.abs(e.clientY - (window.innerHeight - 50)) < 80) {
      direction = e.clientX > petCenter ? 1 : -1;
      if (state === 'idle') {
        setState('idle');
      }
    }
  });
  
  // 动画帧
  function loop() {
    move();
    requestAnimationFrame(loop);
  }
  
  // 启动
  setTimeout(stateLoop, 1000);
  loop();
  
  // 偶尔自动说话
  setInterval(() => {
    if (Math.random() < 0.3 && state !== 'sleep') {
      showBubble();
    }
  }, 15000);
})();
</script>
